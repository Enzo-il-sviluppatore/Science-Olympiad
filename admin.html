<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Club attendance</title><link rel="stylesheet" href="style.css?v=5"></head><body>
<main id="out"><h1>Admin</h1><button id="in">Sign in with Google</button>
<p id="err" class="msg bad" role="alert"></p><button id="so2" class="ghost" hidden>Sign out</button></main>
<div class="shell" id="app" hidden>
<aside class="side"><h2>Club attendance</h2>
<nav><button class="nav on" data-v="v-att">Attendance</button><button class="nav" data-v="v-mtg">Meeting days</button><button class="nav" data-v="v-stu">Students</button></nav>
<div class="me"><b id="me"></b><button id="so" class="ghost">Sign out</button></div></aside>
<div class="content">
<section id="v-att"><h1>Attendance</h1>
<div class="row"><label>Date <input type="date" id="d"></label><label>Name <input id="q" placeholder="Search name"></label></div>
<table><thead><tr><th>Name</th><th>Email</th><th>Time</th></tr></thead><tbody id="att"></tbody></table><p class="mut" id="cnt"></p></section>
<section id="v-mtg" hidden><h1>Meeting days</h1><p class="mut">Wednesdays are added automatically for the next 12 weeks. Cancel a day, or add a different one.</p>
<div class="row"><input type="date" id="nd"><button id="addm">Add meeting day</button></div><table><tbody id="mt"></tbody></table></section>
<section id="v-stu" hidden><h1>Students <button class="plus" id="plus" aria-label="Add student" title="Add student">+</button></h1>
<form class="card" id="sf" hidden><div class="row"><input id="sn" placeholder="Full name" autocomplete="off"><input id="se" type="email" placeholder="student@email.com" autocomplete="off"></div>
<div class="row"><button type="submit">Add student</button><button type="button" class="ghost" id="cx">Cancel</button></div></form>
<p class="mut" id="sc"></p><ul class="list" id="st"></ul></section>
<div class="msg bad" id="msg"></div></div></div>
<script type="module">
import {auth,fs,db,$,signIn,redirectResult,signOut,onAuthStateChanged,todayET,isWed,pretty,meetingDoc,emailOf,has} from "./common.js";
const say=t=>$("msg").textContent=t||"";
const col=n=>fs.collection(db,n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("in").onclick=()=>{$("err").textContent="";signIn().catch(e=>{$("err").textContent="Sign-in failed ("+(e.code||"error")+"): "+e.message})};
$("so").onclick=$("so2").onclick=()=>signOut(auth);
redirectResult().catch(e=>{$("err").textContent="Sign-in failed ("+(e.code||"error")+"): "+e.message});
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n===b));
  document.querySelectorAll(".content section").forEach(s=>s.hidden=s.id!==b.dataset.v);say("")});
async function att(){
  const s=await fs.getDocs(fs.query(col("attendance"),fs.where("date","==",$("d").value)));
  const q=$("q").value.toLowerCase().trim();
  const rows=s.docs.map(x=>x.data()).filter(r=>!q||r.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  $("att").innerHTML=rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${r.at?r.at.toDate().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/New_York"}):""}</td></tr>`).join("")||`<tr><td colspan="3" class="mut">No check-ins found.</td></tr>`;
  $("cnt").textContent=rows.length+" checked in";
}
async function meetings(){
  const s=await fs.getDocs(col("meetings"));const t=todayET();
  $("mt").innerHTML=s.docs.filter(x=>/^\d{4}-\d\d-\d\d$/.test(x.id)&&x.id>=t).sort((a,b)=>a.id.localeCompare(b.id)).map(x=>`<tr><td>${pretty(x.id)}</td><td>${x.data().open?"Meeting":"Canceled"}</td><td><button class="ghost" data-id="${x.id}" data-open="${x.data().open}">${x.data().open?"Cancel":"Restore"}</button> <button class="ghost" data-del="${x.id}" aria-label="Delete this day" title="Delete this day">✕</button></td></tr>`).join("");
}
async function seed(){
  const s=await fs.getDocs(col("meetings")),have=new Set(s.docs.map(x=>x.id));
  const rm=s.docs.find(x=>x.id==="_removed");(rm?rm.data().dates||[]:[]).forEach(d=>have.add(d));
  for(let i=0;i<84;i++){const d=new Date(todayET()+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+i);const k=d.toISOString().slice(0,10);
    if(isWed(k)&&!have.has(k))await fs.setDoc(fs.doc(db,"meetings",k),meetingDoc(k));}
}
async function students(){
  const s=await fs.getDocs(col("students"));
  $("sc").textContent=s.size+(s.size===1?" student":" students");
  $("st").innerHTML=s.docs.sort((a,b)=>a.data().name.localeCompare(b.data().name)).map(x=>`<li><div class="grow">${esc(x.data().name)}<small>${esc(x.id)}</small></div><button class="ghost" data-rm="${x.id}" data-n="${esc(x.data().name)}">Remove</button></li>`).join("")||`<li class="mut">No students yet. Tap + to add one.</li>`;
}
$("mt").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.del){if(!confirm("Delete "+pretty(b.dataset.del)+" from the list?"))return;
    await fs.deleteDoc(fs.doc(db,"meetings",b.dataset.del));await fs.setDoc(fs.doc(db,"meetings","_removed"),{dates:fs.arrayUnion(b.dataset.del)},{merge:true});return meetings()}
  await fs.setDoc(fs.doc(db,"meetings",b.dataset.id),meetingDoc(b.dataset.id,b.dataset.open!=="true"));meetings();};
$("addm").onclick=async()=>{const d=$("nd").value;if(!d||d<todayET())return say("Pick today or a future date.");say("");
  await fs.setDoc(fs.doc(db,"meetings",d),meetingDoc(d));meetings();};
$("plus").onclick=()=>{$("sf").hidden=false;$("sn").focus()};
$("cx").onclick=()=>{$("sf").hidden=true;$("sf").reset();say("")};
$("sf").onsubmit=async e=>{e.preventDefault();const n=$("sn").value.trim(),m=$("se").value.trim().toLowerCase();
  if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m))return say("Enter a name and a valid email.");say("");
  await fs.setDoc(fs.doc(db,"students",m),{name:n});$("sf").reset();$("sn").focus();students();};
$("st").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  if(confirm("Remove "+b.dataset.n+"?")){await fs.deleteDoc(fs.doc(db,"students",b.dataset.rm));students();}};
$("d").onchange=$("q").oninput=att;
onAuthStateChanged(auth,async u=>{
  $("out").hidden=!!u;$("app").hidden=true;$("so2").hidden=true;$("err").textContent="";if(!u)return;
  if(!(await has("admins",emailOf(u)))){$("out").hidden=false;$("in").hidden=true;$("err").textContent="This account isn't an admin.";$("so2").hidden=false;return}
  $("in").hidden=false;$("app").hidden=false;$("me").textContent=u.displayName||u.email;$("d").value=todayET();
  try{await seed();await Promise.all([att(),meetings(),students()])}catch(e){say(e.message)}
});
</script></body></html>
